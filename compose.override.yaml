# Development environment override
services:
  api:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - vendor_php:/app/vendor
      - ./api/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./api/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: demo
      # Local access log next to the code instead of the caddy_data volume
      CADDY_ACCESS_LOG: /app/var/log/access.log
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
  worker:
    build:
      context: ./api
      target: frankenphp_dev
    volumes:
      - ./api:/app
      - vendor_php:/app/vendor
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  pwa:
    build:
      context: ./pwa
      target: dev
    volumes:
      - ./pwa:/srv/app
    environment:
      # On Linux, you may want to comment the following line for improved performance
      WATCHPACK_POLLING: "true"

  database:
    ports:
      - target: 5432
        published: ${POSTGRES_PORT:-5433}
        protocol: tcp

volumes:
  vendor_php:
