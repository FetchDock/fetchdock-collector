name: CI

on:
  push:
    branches:
      - main
      - develop
      - release/**
  pull_request: ~
  workflow_dispatch: ~

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Set registry name
        run: echo "IMAGES_PREFIX=${{ env.REGISTRY }}/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      -
        name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            api.cache-from=type=gha,scope=api-${{github.ref}}
            api.cache-from=type=gha,scope=api-refs/heads/develop
            api.cache-to=type=gha,scope=api-${{github.ref}},mode=max
            worker.cache-from=type=gha,scope=api-${{github.ref}}
            worker.cache-from=type=gha,scope=api-refs/heads/develop
            pwa.cache-from=type=gha,scope=pwa-${{github.ref}}
            pwa.cache-from=type=gha,scope=pwa-refs/heads/develop
            pwa.cache-to=type=gha,scope=pwa-${{github.ref}},mode=max
      -
        name: Start services
        id: start_services
        run: docker compose up --wait --no-build
      -
        name: Debug in case services do not start
        if: failure() && steps.start_services.outcome == 'failure'
        run: docker compose logs --no-color
      -
        name: Check API reachability
        run: curl -vk --fail-with-body https://localhost/.well-known/fetchdock-collector
      -
        name: Check PWA reachability
        run: "curl -vk --fail-with-body -H 'Accept: text/html' https://localhost/admin"
      -
        name: Check that the API requires a maintainer
        run: test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/users/me)" = 401
      -
        name: Check that Mercure has no anonymous subscribers
        run: test "$(curl -sk -o /dev/null -m 5 -w '%{http_code}' 'https://localhost/.well-known/mercure?topic=test')" = 401
      -
        name: Doctrine schema validator
        run: docker compose exec -T api bin/console doctrine:schema:validate
      -
        name: Load mock data
        run: docker compose exec -T api bin/console app:fixtures:seed --no-interaction
      -
        name: Create test database
        run: docker compose exec -T api bin/console -e test doctrine:database:create
      -
        name: Run migrations
        run: docker compose exec -T api bin/console -e test doctrine:migrations:migrate --no-interaction
      -
        name: Run PHPUnit
        run: docker compose exec -T api bin/phpunit --no-coverage --testdox
      -
        name: Check that the contract is exported
        run: |
          docker compose exec -T api bin/console api:openapi:export > /tmp/collector-openapi.json
          jq -e '.paths["/users/me"]' /tmp/collector-openapi.json > /dev/null
      -
        name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  pwa:
    name: PWA typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
