name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it.
      placeholder: |
        1. POST /v1/reports with … (or: forward a report from a FetchDock server)
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      placeholder: |
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error text, log lines, HTTP status + response body, screenshots. Never paste report contents, instance secrets or instance ids.
      render: text
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Ingest API (/v1)
        - Maintainer API / PWA
        - Stats
        - Retention / privacy
        - Mercure / live updates
        - Auth (instances or maintainers)
        - Deployment / Docker
        - Other
  - type: input
    id: version
    attributes:
      label: Collector version / branch
      placeholder: 0.1.0 (image tag) or develop @ <sha>
    validations:
      required: true
  - type: input
    id: other-version
    attributes:
      label: FetchDock server version (if involved)
  - type: dropdown
    id: frequency
    attributes:
      label: Reproducibility
      options:
        - Always
        - Sometimes
        - Once
  - type: textarea
    id: notes
    attributes:
      label: Suspected cause / pointers (optional)
      description: Files, classes, related issues or PRs, a recent change that may have caused it.
